<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- An ephemeris tabulates where a body was at a given time, so the mark is an orrery:
       two orbits, two bodies caught at a moment. Colours are the interface's own, and the
       two dots are the provenance greens and oranges the ruler uses, not decoration.
       Kept to four shapes because anything finer disappears at 16px. -->
  <rect width="32" height="32" rx="6" fill="#05070a"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#6d6659" stroke-width="1.1"/>
  <circle cx="16" cy="16" r="5.5" fill="none" stroke="#6d6659" stroke-width="1.1"/>
  <circle cx="16" cy="16" r="2.1" fill="#ece5d8"/>
  <circle cx="16" cy="5.5" r="2.6" fill="#e0662f"/>
  <circle cx="21.5" cy="16" r="1.9" fill="#86b96a"/>
</svg>
